[package]
name = "nsh-app-difflens"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "difflens-runner"
path = "src/main.rs"

[dependencies]
rfd = "0.17.2"
ignore = "0.4.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
libc = "0.2"
nsh-core = { git = "https://github.com/longbridge/nsh.git", rev = "5757911cf23d5a800fa1a353152bdbeeb5057d84" }
nsh-base = { git = "https://github.com/longbridge/nsh.git", rev = "5757911cf23d5a800fa1a353152bdbeeb5057d84" }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-macos-app = { git = "https://github.com/longbridge/nsh.git", rev = "5757911cf23d5a800fa1a353152bdbeeb5057d84" }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh.git", rev = "5757911cf23d5a800fa1a353152bdbeeb5057d84" }

[profile.release]
debug = 1
