[package]
name = "nsh-app-difflens"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "difflens-runner"
path = "src/main.rs"

[dependencies]
rfd = "0.17.2"
ignore = "0.4.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
libc = "0.2"
nsh-core = "=0.3.0"
nsh-base = "=0.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-macos-app = "=0.3.0"
nsh-platform-macos = "=0.3.0"

[profile.release]
debug = 1
